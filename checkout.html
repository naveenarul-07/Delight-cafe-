<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Order Details | Delight Cafe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=mobileview2">
</head>

<body class="checkout-page">

    <header class="nav">
        <div class="logo">Delight Cafe</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="orders.html">My Orders</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="checkout-shell checkout-shell-minimal">
        <div class="checkout-header">
            <h1>Order Details</h1>
            <p class="checkout-subtitle">Kindly provide the information below to proceed to payment.</p>
        </div>

        <form id="orderDetailsForm" class="order-details-form" novalidate>
            <section class="form-section">
                <h2>Service</h2>
                <div class="service-type-options">
                    <label class="service-type-card">
                        <input type="radio" name="serviceType" value="dining" checked>
                        <span class="service-type-label">Dine-in</span>
                    </label>
                    <label class="service-type-card">
                        <input type="radio" name="serviceType" value="delivery">
                        <span class="service-type-label">Delivery</span>
                    </label>
                </div>
            </section>

            <section class="form-section">
                <h2>Contact</h2>
                <div class="form-grid">
                    <label class="form-field">
                        <span>Full name *</span>
                        <input type="text" id="fullName" name="fullName" placeholder="As on your order" autocomplete="name" required>
                    </label>
                    <label class="form-field">
                        <span>Mobile number *</span>
                        <input type="tel" id="phone" name="phone" placeholder="10-digit WhatsApp number" inputmode="numeric" autocomplete="tel" required>
                        <small class="field-hint">Use commas to add more than one number for the bill.</small>
                    </label>
                    <label class="form-field form-field-full">
                        <span>Email</span>
                        <input type="email" id="email" name="email" placeholder="Optional" autocomplete="email">
                    </label>
                </div>
            </section>

            <section class="form-section hidden" id="deliverySection">
                <h2>Delivery address</h2>
                <div class="form-grid">
                    <label class="form-field form-field-full">
                        <span>Address *</span>
                        <textarea id="addressLine" name="addressLine" rows="2" placeholder="House / flat, street, area"></textarea>
                    </label>
                    <label class="form-field">
                        <span>City *</span>
                        <input type="text" id="city" name="city" placeholder="City">
                    </label>
                    <label class="form-field">
                        <span>Pincode *</span>
                        <input type="text" id="pincode" name="pincode" placeholder="6 digits" maxlength="6" inputmode="numeric">
                    </label>
                </div>
            </section>

            <section class="form-section">
                <h2>Notes</h2>
                <div class="form-grid">
                    <label class="form-field form-field-full">
                        <span>Special instructions</span>
                        <textarea id="orderNotes" name="orderNotes" rows="2" placeholder="Optional — allergies, gate code, or other requests"></textarea>
                    </label>
                </div>
            </section>

            <section class="form-section form-section-declaration">
                <label class="form-declaration">
                    <input type="checkbox" id="declaration" name="declaration" required>
                    <span>I confirm that the details above are accurate and agree to Delight Cafe’s terms of service.</span>
                </label>

                <p id="checkoutError" class="checkout-error" hidden></p>

                <div class="checkout-actions" id="checkoutActions">
                    <a href="menu.html" class="btn-secondary checkout-back-btn">Back</a>
                    <button type="submit" id="checkoutSubmitBtn" class="confirm-order-btn" disabled>Continue to payment</button>
                </div>
            </section>
        </form>
    </main>

    <footer>
        <p>&copy; 2025 Delight Cafe. All rights reserved.</p>
        <button id="logoutBtn" class="footer-logout" type="button" onclick="logout()" style="display:none">Logout</button>
    </footer>

    <script src="js/script.js?v=apicomplete2"></script>
</body>

</html>
