[build]
  publish = "."
  command = "npm install --include=optional"
  functions = "netlify/functions"

[functions]
  node_bundler = "nft"
  external_node_modules = ["mongodb", "express", "express-session"]
  included_files = ["menu/**", "db/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[build.environment]
  NODE_VERSION = "20"
