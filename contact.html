<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Contact | Delight Cafe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=mobileview2">
</head>

<body class="home-page contact-page">

    <header class="nav nav-glass">
        <div class="logo">Delight Cafe</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="about.html">About</a>
            <a href="contact.html" class="nav-active">Contact</a>
        </nav>
    </header>

    <main class="home-stage contact-stage">
        <div class="home-stage-env" aria-hidden="true">
            <span class="home-orb home-orb-a"></span>
            <span class="home-orb home-orb-b"></span>
            <span class="home-orb home-orb-c"></span>
            <span class="home-mist"></span>
            <span class="home-spark home-spark-1"></span>
            <span class="home-spark home-spark-2"></span>
            <span class="home-spark home-spark-3"></span>
        </div>
        <div class="home-stage-inner contact-stage-inner">
            <section class="home-brand">
                <p class="home-kicker">We’re listening</p>
                <h1 class="home-brand-name contact-brand-name">Delight Cafe</h1>
                <p class="home-lead">Reservations, feedback, or a quiet hello — send a note and we’ll get back soon.</p>
            </section>

            <form class="contact-form home-auth-panel" id="contactForm">
                <p class="auth-eyebrow">Write to us</p>
                <h2>Contact</h2>
                <p id="contactStatus" class="contact-status" hidden></p>
                <label class="auth-label" for="contactName">Name</label>
                <input type="text" id="contactName" placeholder="Your name" required>
                <label class="auth-label" for="contactEmail">Email</label>
                <input type="email" id="contactEmail" placeholder="you@email.com" required>
                <label class="auth-label" for="contactMessage">Message</label>
                <textarea id="contactMessage" rows="4" placeholder="How can we help?" required></textarea>
                <button type="submit" id="contactSubmitBtn">Send message</button>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Delight Cafe. Crafted for every visit.</p>
        <button id="logoutBtn" class="footer-logout" type="button" onclick="logout()" style="display:none">Logout</button>
    </footer>

    <script src="js/script.js?v=apicomplete2"></script>
</body>

</html>
