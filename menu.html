<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Menu | Delight Cafe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=mobileview2">
</head>

<body class="menu-page">

    <header class="nav nav-glass">
        <div class="logo">Delight Cafe</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="menu.html" class="nav-active">Menu</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <div class="menu-sticky-chrome">
        <header class="menu-hero">
            <p class="section-kicker">Seasonal &amp; signature</p>
            <h1 class="page-title">Our Menu</h1>
            <p class="menu-tagline">Crafted with care · Served with elegance</p>
        </header>

        <section class="menu-category-bar-wrap" aria-label="Menu categories">
            <div class="menu-category-bar menu-category-bar-single" id="menuFilters"></div>
        </section>
    </div>

    <div class="menu-items" id="menuItems"></div>

    <footer class="site-footer">
        <p>&copy; 2026 Delight Cafe. Crafted for every visit.</p>
        <button id="logoutBtn" class="footer-logout" type="button" onclick="logout()" style="display:none">Logout</button>
    </footer>

    <div class="cart-fixed-panel">
        <button class="cart-toggle-btn" id="cartToggleBtn" type="button" onclick="toggleCart()" hidden>
            My Cart <span id="cartBadge" class="cart-badge"></span>
        </button>

        <div class="cart-backdrop" id="cartBackdrop" onclick="toggleCart(false)" aria-hidden="true"></div>

        <aside class="menu-cart" id="menuCart" aria-label="Shopping cart">
            <div class="cart-header">
                <h3>Your Cart</h3>
                <button class="cart-close" type="button" onclick="toggleCart(false)" aria-label="Close cart">&times;</button>
            </div>

            <section class="cart-section">
                <h4>Added items</h4>
                <p id="emptyMsg" class="empty-msg">Your cart is empty</p>
                <ul id="orderList" class="order-list"></ul>
                <div id="cartTotal" class="cart-total"></div>
                <button id="confirmOrderBtn" class="confirm-order-btn" type="button" onclick="confirmOrder()" style="display:none">Confirm Order</button>
                <button class="clear-btn" type="button" onclick="clearOrders()">Clear Cart</button>
            </section>
        </aside>
    </div>
    <script src="js/script.js?v=apicomplete2"></script>
</body>

</html>
