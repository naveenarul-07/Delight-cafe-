<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Create Account | Delight Cafe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=mobileview2">
</head>

<body class="home-page">

    <header class="nav nav-glass">
        <div class="logo">Delight Cafe</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="home-stage">
        <div class="home-stage-glow" aria-hidden="true"></div>
        <div class="home-stage-inner home-stage-inner-centered">
            <form class="login-form home-auth-panel auth-panel-compact" id="registerPanel" onsubmit="event.preventDefault(); register();">
                <p class="auth-eyebrow">New membership</p>
                <h2>Create account</h2>
                <p class="auth-lead">Use a unique mobile number or email. Existing details cannot be reused.</p>
                <p id="registerError" class="login-error" role="alert"></p>

                <label class="auth-label" for="regPhone">Mobile number</label>
                <input type="tel" id="regPhone" name="phone" placeholder="10-digit mobile number" inputmode="numeric" autocomplete="tel">

                <p class="auth-or">or</p>

                <label class="auth-label" for="regEmail">Email address</label>
                <input type="email" id="regEmail" name="email" placeholder="name@email.com" autocomplete="email">

                <label class="auth-label" for="regPassword">Password</label>
                <div class="password-field">
                    <input type="password" id="regPassword" placeholder="At least 6 characters" required autocomplete="new-password" minlength="6">
                    <button type="button" class="password-toggle" onclick="togglePassword('regPassword', this)" aria-label="Show password">
                        <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="icon-eye-off" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>

                <label class="auth-label" for="regConfirmPassword">Confirm password</label>
                <div class="password-field">
                    <input type="password" id="regConfirmPassword" placeholder="Re-enter password" required autocomplete="new-password" minlength="6">
                    <button type="button" class="password-toggle" onclick="togglePassword('regConfirmPassword', this)" aria-label="Show password">
                        <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="icon-eye-off" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                            <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>

                <div class="login-links">
                    <a href="index.html#loginPanel">Already registered? Sign in</a>
                </div>
                <button type="submit" id="registerSubmitBtn">Create account</button>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Delight Cafe. Crafted for every visit.</p>
        <button id="logoutBtn" class="footer-logout" type="button" onclick="logout()" style="display:none">Logout</button>
    </footer>

    <script src="js/script.js?v=apicomplete2"></script>
</body>

</html>
